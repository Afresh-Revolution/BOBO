name: Deploy Next BOBO

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SECRET }}
          script: |
            set -e
            cd /root/afresh/BOBO
            git fetch --all
            git reset --hard origin/main
            bun install
            bun run build
            
            pm2 restart bobo --update-env || pm2 start bun --name bobo -- run start -- -p 3421
            pm2 save
            nginx -t
            systemctl reload nginx
